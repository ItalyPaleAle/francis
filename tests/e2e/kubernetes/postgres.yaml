apiVersion: v1
kind: Secret
metadata:
  name: francis-e2e-postgres
type: Opaque
stringData:
  POSTGRES_USER: francis
  POSTGRES_PASSWORD: francis
  POSTGRES_DB: francis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: francis-e2e-postgres
  labels:
    app.kubernetes.io/name: francis-e2e-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: francis-e2e-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: francis-e2e-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          envFrom:
            - secretRef:
                name: francis-e2e-postgres
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - francis
                - -d
                - francis
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources: {}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: francis-e2e-postgres
spec:
  selector:
    app.kubernetes.io/name: francis-e2e-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
