          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Placement:
      properties:
        actorId:
          type: string
        actorType:
          type: string
        hostId:
          type: string
        idleTimeoutMs:
          type: integer
      required:
      - actorId
      - actorType
      - hostId
      - idleTimeoutMs
      type: object
    Retention:
      properties:
        completedJobs:
          $ref: '#/components/schemas/RetentionPolicy'
        deadLetteredJobs:
          $ref: '#/components/schemas/RetentionPolicy'
      required:
      - completedJobs
      - deadLetteredJobs
      type: object
    RetentionPolicy:
      description: Whether terminal jobs leave a record, and for how long.
      properties:
        forever:
          description: True when the record is kept indefinitely
          type: boolean
        recorded:
          description: True when a record of the terminal job is kept
          type: boolean
        retentionMs:
          description: How long the record is kept, in milliseconds, omitted when
            zero
          type: integer
      required:
      - forever
      - recorded
      type: object
    Runtime:
      properties:
        address:
          type: string
        connectedHosts:
          description: The number of host sessions the replica holds, `null` when
            it could not be queried
          nullable: true
          type: integer
        error:
          description: Set when the replica could not be queried
          type: string
        expiresAt:
          description: When the replica's membership expires unless renewed
          format: date-time
          type: string
        lastHeartbeat:
          format: date-time
          type: string
        runtimeId:
          type: string
        self:
          description: True for the replica serving this request
          type: boolean
      required:
      - address
      - connectedHosts
      - expiresAt
      - lastHeartbeat
      - runtimeId
      - self
      type: object
    Step:
      properties:
        children:
          description: The child workflow instances started by this step, omitted
            when none
          items:
            $ref: '#/components/schemas/ChildLink'
          type: array
        completedAt:
          format: date-time
          type: string
        error:
          type: string
        iteration:
          description: The loop iteration, omitted when zero
          type: integer
        kind:
          description: The node kind, such as `step`, `parallel`, `foreach`, `child`,
            `wait`, or `loop`
          type: string
        name:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          description: The step status, such as `pending`, `running`, `completed`,
            `failed`, `skipped`, `compensating`, `compensated`, or `compensation-failed`
          type: string
        taskCount:
          type: integer
        tasksRemaining:
          type: integer
      required:
      - kind
      - name
      - status
      - taskCount
      - tasksRemaining
      type: object
    Workflow:
      properties:
        conflicts:
          items:
            $ref: '#/components/schemas/WorkflowConflict'
          type: array
        hosts:
          description: The live hosts serving the workflow's orchestrator
          items:
            $ref: '#/components/schemas/WorkflowHost'
          type: array
        name:
          type: string
        versions:
          description: The versions recorded by the workflow's definition registry
          items:
            $ref: '#/components/schemas/WorkflowVersion'
          type: array
      required:
      - conflicts
      - hosts
      - name
      - versions
      type: object
    WorkflowConflict:
      description: A version registered or served with more than one definition fingerprint.
      properties:
        fingerprints:
          items:
            type: string
          type: array
        hosts:
          description: The hosts serving the version, not counting the registry itself
          items:
            type: string
          type: array
        version:
          type: integer
      required:
      - fingerprints
      - hosts
      - version
      type: object
    WorkflowDefinition:
      properties:
        fingerprint:
          type: string
        name:
          type: string
        version:
          type: integer
      required:
      - fingerprint
      - name
      - version
      type: object
    WorkflowHost:
      properties:
        definitions:
          description: The versions the host serves, `null` when the host could not
            be queried
          items:
            $ref: '#/components/schemas/WorkflowHostDefinition'
          nullable: true
          type: array
        draining:
          type: boolean
        hostId:
          type: string
      required:
      - definitions
      - draining
      - hostId
      type: object
    WorkflowHostDefinition:
      properties:
        fingerprint:
          type: string
        version:
          type: integer
      required:
      - fingerprint
      - version
      type: object
    WorkflowLabels:
      description: The labels the workflow engine stores with an orchestrator's state.
        Empty fields are omitted.
      properties:
        created:
          description: The creation time, in the stored label format (`2006-01-02T15:04:05.000000000Z`)
          type: string
        parent:
          type: string
        status:
          type: string
        version:
          type: integer
      type: object
    WorkflowLink:
      description: Links an actor of a workflow to its workflow instance, derived
        from the actor type and ID naming conventions.
      properties:
        capability:
          description: The capability of a worker or undo actor type, when it has
            one
          type: string
        instanceId:
          description: The workflow instance, for orchestrator, worker, and undo actors
            whose ID could be parsed
          type: string
        role:
          enum:
          - orchestrator
          - worker
          - undo
          - registry
          - other
          type: string
        step:
          description: The step, for worker and undo actors
          type: string
        taskIndex:
          description: The task index within the step, for worker and undo actors
          type: integer
        workflow:
          type: string
      required:
      - role
      - workflow
      type: object
    WorkflowVersion:
      properties:
        fingerprint:
          type: string
        firstSeenAt:
          format: date-time
          type: string
        generation:
          type: integer
        version:
          type: integer
      required:
      - fingerprint
      - firstSeenAt
      - generation
      - version
      type: object
    Workflows:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/HostError'
          type: array
        items:
          items:
            $ref: '#/components/schemas/Workflow'
          type: array
        observedAt:
          format: date-time
          type: string
        partial:
          description: True when some hosts could not be queried, so their definitions
            are missing
          type: boolean
      required:
      - errors
      - items
      - observedAt
      - partial
      type: object
  securitySchemes:
    bearerAuth:
      description: 'A read-only or management token from the server configuration,
        sent as `Authorization: Bearer <token>`. Read-only tokens grant every scope
        except those ending in `:manage`; management tokens grant every scope.'
      in: header
      name: Authorization
      type: apiKey
info:
  contact: {}
  description: |
    The management API exposes read-only views of a Francis cluster (hosts, runtimes, placements, in-memory activations, actor state, jobs, alarms, and workflows), plus a small set of audited actions (drain a host, deactivate an actor, cancel/suspend/resume a workflow instance).

    ## Authentication and scopes

    Every route under `/api/v1` requires an `Authorization: Bearer <token>` header.
    `GET /api/v1/openapi.yaml` and `GET /healthz` (served at the root, outside `/api/v1`) are public and don't require a token.

    Each operation declares the scope it requires in its description and in the `x-required-scope` extension.
    The server is configured with two token lists:

    - **Read-only tokens** receive every scope except those ending in `:manage`.
    - **Management tokens** receive every scope.

    | Scope | Grants |
    | --- | --- |
    | `cluster:read` | Cluster summary, runtimes, hosts |
    | `actors:read` | Activations, placements, actor types, actor-state listings |
    | `actors:state:read` | Reading the stored state of an actor (audited); a workflow's actor types also need `workflows:data:read` |
    | `workflows:read` | Workflows, instances, event history |
    | `workflows:data:read` | Including workflow instance input and output in instance details, and reading the stored state of a workflow's actor types (audited) |
    | `jobs:read` | Jobs and alarms |
    | `actors:manage` | Deactivating an actor |
    | `hosts:manage` | Draining a host |
    | `workflows:manage` | Cancelling, suspending, and resuming workflow instances |

    A missing or unknown token yields `401` with a `WWW-Authenticate: Bearer realm="francis-management"` header; a valid token lacking the route's scope yields `403`.

    ## Pagination

    Paginated endpoints accept `limit` (1 to 1000, default 100) and an opaque `cursor`, and return `{ "items": [...], "nextCursor": "..." }`.
    `nextCursor` is omitted on the last page.
    Pass it back unchanged as `cursor` to fetch the next page; its contents are not part of the contract.
    A malformed cursor or an out-of-range limit yields `400 badRequest`.
    A page may contain fewer items than `limit` even when more pages follow (for example when a filter is applied after reading a page), so always rely on `nextCursor` to detect the end.

    ## Fan-out endpoints and partial results

    Some endpoints query every host's in-memory snapshot (`/activations`, `/actor-types`, `/workflows`, and the activation count of `/cluster/summary`).
    Hosts are queried concurrently with a per-host timeout, and a host that cannot be queried does not fail the request: the response sets `partial: true` and lists the host in `errors` (see `HostError`).
    Each host is sampled independently, so these responses are operational evidence rather than a transactionally consistent view of the cluster: an actor that moved during collection may appear twice or not at all, and actors may move between pages.
    Use `GET /hosts/{hostId}/activations` for the freshest view of one host.

    ## Errors

    Every error response has a JSON body described by the `Error` schema.
    Every response carries an `X-Request-Id` header, which is also echoed as `requestId` in error bodies and recorded in audit logs.
    Errors with `retryable: true` may succeed if the request is repeated later.

    Error `code` values:

    | Code | Status | Meaning |
    | --- | --- | --- |
    | `badRequest` | 400 | Invalid path segment, query parameter, cursor, or request body |
    | `unauthorized` | 401 | Missing or unknown bearer token |
    | `forbidden` | 403 | The token does not grant the route's scope |
    | `notFound` | 404 | The resource does not exist, or no such route |
    | `notApplicable` | 404 | The resource does not exist in this topology (for example runtimes in the local topology) |
    | `eventHistoryDisabled` | 404 | The workflow opted out of event history |
    | `methodNotAllowed` | 405 | The path exists but does not serve the method; the `Allow` header lists the methods it serves |
    | `lastServer` | 409 | Draining the host would leave one or more actor types without a live server; `details.actorTypes` lists them |
    | `exclusiveLeaseHeld` | 409 | An exclusive-access lease is held on the cluster (for example during a restore), so drains and workflow controls are refused; `GET /api/v1/cluster/summary` reports who holds it; retryable |
    | `hostReattached` | 409 | The host kept reconnecting, so the request could not be delivered to its current session; send it again; retryable |
    | `payloadTooLarge` | 413 | The request body is larger than 64 KiB |
    | `stateNotDecodable` | 422 | The stored actor state cannot be rendered as JSON, because it is not valid MessagePack or a map has two keys that would share a JSON name |
    | `internal` | 500 | Unexpected server error |
    | `hostUnavailable` | 503 | The host, or the runtime owning its session, could not be reached or was too busy; retryable |
    | `noHostsReachable` | 503 | None of the queried hosts could be reached; `details.errors` lists them; retryable |
    | `timeout` | 504 | The request timed out; retryable |
  title: Francis management API
  version: v1
openapi: 3.0.3
paths:
  /api/v1/activations:
    get:
      description: |-
        Requires scope `actors:read`.

        Walks the hosts in host ID order, querying a batch of hosts concurrently, until the page is full.
        Items are ordered by host, then by actor type and actor ID within each host.

        This is a fan-out endpoint: a host that cannot be queried is reported in `errors` and sets `partial: true`, and its activations are missing from the page.
        If every queried host failed, the response is `503 noHostsReachable` with the host errors in `details.errors`.
        Each host is sampled independently, so the listing is not transactionally consistent: an actor that moved between hosts during collection or between pages may be listed twice or not at all.
      operationId: listActivations
      parameters:
      - description: Maximum number of items to return
        in: query
        name: limit
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          type: integer
      - description: Opaque cursor returned as nextCursor by the previous page; omit
          for the first page
        in: query
        name: cursor
        schema:
          type: string
      - description: Only return activations of this actor type
        in: query
        name: type
        schema:
          type: string
      - description: Only query this host, returning 404 notFound when the host is
          not registered
        in: query
        name: host
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activations'
          description: A page of activations
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`badRequest`: an invalid path segment, query parameter, cursor,
            or request body'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`unauthorized`: the bearer token is missing or unknown'
          headers:
            WWW-Authenticate:
              description: Always Bearer realm="francis-management" when the token
                is missing or unknown
              schema:
                type: string
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`forbidden`: the token does not grant the scope the route
            requires'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`notFound`: the host in the host parameter is not registered'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`internal`: an unexpected server error'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`noHostsReachable`: none of the queried hosts could be reached,
            with the host errors in details.errors; retryable'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`timeout`: the request timed out; retryable'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
      security:
      - bearerAuth: []
      summary: List in-memory activations across hosts
      tags:
      - Actors
      x-required-scope: actors:read
  /api/v1/actor-states:
    get:
      description: |-
        Requires scope `actors:read`.

        Lists the IDs of the actors of one type that have stored state, ordered by actor ID, with their workflow labels when the state belongs to a workflow orchestrator.
        The state itself is not returned; use `GET /api/v1/actor-states/{type}/{id}`.
      operationId: listActorStates
      parameters:
      - description: The actor type, which must not be empty and must not contain
          a slash
        in: query
        name: type
        required: true
        schema:
          minLength: 1
          type: string
      - description: Maximum number of items to return
        in: query
        name: limit
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          type: integer
      - description: Opaque cursor returned as nextCursor by the previous page; omit
          for the first page
        in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page-ActorStateItem'
          description: A page of actors with stored state
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`badRequest`: an invalid path segment, query parameter, cursor,
            or request body'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`unauthorized`: the bearer token is missing or unknown'
          headers:
            WWW-Authenticate:
              description: Always Bearer realm="francis-management" when the token
                is missing or unknown
              schema:
                type: string
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`forbidden`: the token does not grant the scope the route
            requires'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`internal`: an unexpected server error'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`timeout`: the request timed out; retryable'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
      security:
      - bearerAuth: []
      summary: List the actors of a type that have stored state
      tags:
      - Actors
      x-required-scope: actors:read
  /api/v1/actor-states/{type}/{id}:
    get:
      description: |-
        Requires scope `actors:state:read`. Every read is audited (the data itself is never logged).
        Reading the state of a workflow's actors, such as an orchestrator's journal, also requires `workflows:data:read`, since it holds the instances' input and output.

        Actor state is stored as MessagePack.
        By default it is converted to JSON and returned inside an `ActorState` envelope.
        Send `Accept: application/msgpack` (also accepted: `application/x-msgpack`, `application/vnd.msgpack`) to receive the exact stored bytes instead, with `Content-Type: application/msgpack`.
        Quality values are honored: the bytes are returned only when a MessagePack type is listed by name with a quality above zero and at least as high as the quality of JSON, so `*/*` alone keeps the JSON envelope.

        JSON conversion convention:

        | MessagePack | JSON | Lossy |
        | --- | --- | --- |
        | nil, bool, array, map with UTF-8 string keys | `null`, boolean, array, object (MessagePack field names are the keys) | no |
        | string that is valid UTF-8 | string | no |
        | integer of any size | decimal string, such as `"42"` or `"18446744073709551615"` | no |
        | float (32 or 64 bit), finite | string with the shortest representation of its precision, such as `"0.1"` or `"1e+21"` | no |
        | float NaN, +Inf, -Inf | string `"NaN"`, `"Infinity"`, `"-Infinity"` | no |
        | bin, or string that is not valid UTF-8 | `{"$binary": "<standard base64>"}` | yes |
        | timestamp extension (type -1) | RFC 3339 string in UTC with nanoseconds, such as `"2026-01-02T03:04:05.123456789Z"` | yes |
        | any other extension | `{"$ext": <type>, "data": "<standard base64>"}` | yes |
        | map key that is not a UTF-8 string | the key as text, such as `"1"` for the integer key 1 | yes |

        Every number is a string, so its exact value survives any JSON parser.
        `lossy` is `true` when any value used a rendering that changes its shape (the rows marked lossy above); numbers don't count, since they are always strings. Request MessagePack when exactness matters.
        If the stored bytes are not a single valid MessagePack value (or are nested more than 512 levels deep), the JSON rendering fails with `422 stateNotDecodable`; the raw bytes can still be read with `Accept: application/msgpack`.
        The same happens when two keys of a map would become the same JSON name, such as `1` and `"1"` or the same key stored twice, since JSON parsers disagree on which value they keep.
      operationId: getActorState
      parameters:
      - description: The actor type, which must not contain a slash
        in: path
        name: type
        required: true
        schema:
          type: string
      - description: The actor ID, which must not contain a slash
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Send application/msgpack to receive the raw stored bytes instead
          of the JSON envelope
        in: header
        name: Accept
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorState'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/ActorState'
          description: 'The actor''s state, or the exact stored MessagePack bytes
            when requested with Accept: application/msgpack'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`badRequest`: an invalid path segment, query parameter, cursor,
            or request body'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`unauthorized`: the bearer token is missing or unknown'
          headers:
            WWW-Authenticate:
              description: Always Bearer realm="francis-management" when the token
                is missing or unknown
              schema:
                type: string
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`forbidden`: the token does not grant the scope the route
            requires, or `workflows:data:read` for a workflow''s actor type'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`notFound`: the actor has no stored state'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/msgpack:
              schema:
                $ref: '#/components/schemas/Error'
          description: '`stateNotDecodable`: the stored state cannot be rendered as
            JSON, because it is not valid MessagePack or a map has two keys that would
            share a JSON name'
          headers:
            X-Request-Id:
              description: A unique ID assigned to the request, also returned as requestId
                in error bodies and recorded in audit logs
              schema:
                type: string
        "500":
          content:
