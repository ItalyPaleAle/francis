components:
  schemas:
    Activation:
      properties:
        activatedAt:
          format: date-time
          type: string
        actorId:
          type: string
        actorType:
          type: string
        deactivating:
          type: boolean
        hostId:
          type: string
        observedAt:
          description: When the host took the snapshot this activation comes from
          format: date-time
          type: string
      required:
      - activatedAt
      - actorId
      - actorType
      - deactivating
      - hostId
      - observedAt
      type: object
    Activations:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/HostError'
          type: array
        finishedAt:
          description: When collection finished
          format: date-time
          type: string
        items:
          items:
            $ref: '#/components/schemas/Activation'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
        partial:
          description: True when some hosts could not be queried, so their activations
            are missing
          type: boolean
        startedAt:
          description: When collection started
          format: date-time
          type: string
      required:
      - errors
      - finishedAt
      - items
      - partial
      - startedAt
      type: object
    ActorState:
      properties:
        actorId:
          type: string
        actorType:
          type: string
        lossy:
          description: True when any value used a rendering that changes its shape,
            such as binary data or a timestamp; numbers are always strings and don't
            count, so `false` doesn't mean the JSON converts back to the stored bytes
          type: boolean
        size:
          description: The size of the stored MessagePack value, in bytes
          type: integer
        state:
          description: The stored value converted to JSON, following the convention
            described on the operation; any JSON value
          type: object
      required:
      - actorId
      - actorType
      - lossy
      - size
      - state
      type: object
    ActorStateItem:
      properties:
        actorId:
          type: string
        workflowLabels:
          allOf:
          - $ref: '#/components/schemas/WorkflowLabels'
          description: Present only for state that has workflow labels
      required:
      - actorId
      type: object
    ActorType:
      properties:
        actorType:
          type: string
        builtIn:
          description: True for actor types built into Francis, such as workflow actors
          type: boolean
        capacityGroups:
          description: The capacity groups that include this type, one entry per reporting
            host
          items:
            $ref: '#/components/schemas/ActorTypeCapacityGroup'
          type: array
        hosts:
          items:
            $ref: '#/components/schemas/ActorTypeHost'
          type: array
        jobRetention:
          allOf:
          - $ref: '#/components/schemas/Retention'
          description: The job retention, `null` when the hosts serving the type registered
            different retentions
          nullable: true
        placements:
          allOf:
          - $ref: '#/components/schemas/Capacity'
          description: The placement usage summed across the hosts serving the type,
            unlimited when any host is unlimited
      required:
      - actorType
      - builtIn
      - capacityGroups
      - hosts
      - jobRetention
      - placements
      type: object
    ActorTypeCapacityGroup:
      properties:
        actorTypes:
          items:
            type: string
          type: array
        hostId:
          description: The host that reported the group
          type: string
        inUse:
          type: integer
        limit:
          type: integer
        name:
          type: string
      required:
      - actorTypes
      - hostId
      - inUse
      - limit
      - name
      type: object
    ActorTypeHost:
      properties:
        draining:
          type: boolean
        hostId:
          type: string
        idleTimeoutMs:
          type: integer
        jobRetention:
          $ref: '#/components/schemas/Retention'
        placements:
          $ref: '#/components/schemas/Capacity'
      required:
      - draining
      - hostId
      - idleTimeoutMs
      - jobRetention
      - placements
      type: object
    ActorTypes:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/HostError'
          type: array
        items:
          items:
            $ref: '#/components/schemas/ActorType'
          type: array
        observedAt:
          format: date-time
          type: string
        partial:
          description: True when some hosts could not be queried, so their capacity
            groups are missing
          type: boolean
      required:
      - errors
      - items
      - observedAt
      - partial
      type: object
    Alarm:
      properties:
        actorId:
          type: string
        actorType:
          type: string
        alarmId:
          type: string
        dueTime:
          format: date-time
          type: string
        interval:
          description: The repeat interval, for repeating alarms
          type: string
        leaseExpiration:
          description: When the lease expires, present only when leased
          format: date-time
          type: string
        leaseHostId:
          description: The host holding the lease, which is the live host the alarm's
            actor is placed on; omitted when not leased, or when the actor has no
            placement on a live host
          type: string
        leased:
          description: True when a host currently holds a lease on the alarm
          type: boolean
        name:
          type: string
        ttl:
          description: When a repeating alarm stops repeating, omitted when unset
          format: date-time
          type: string
      required:
      - actorId
      - actorType
      - alarmId
      - dueTime
      - leased
      - name
      type: object
    BoundedCount:
      description: A count that stops at 10,000.
      properties:
        count:
          type: integer
        truncated:
          description: True when the count reached the cap, so the real count is at
            least `count`
          type: boolean
      required:
      - count
      - truncated
      type: object
    Capacity:
      description: The placement usage of an actor type.
      properties:
        available:
          description: The remaining placements (never negative), `null` when unlimited
          nullable: true
          type: integer
        limit:
          description: The placement limit, `null` when unlimited
          nullable: true
          type: integer
        unlimited:
          type: boolean
        used:
          type: integer
      required:
      - available
      - limit
      - unlimited
      - used
      type: object
    CapacityGroup:
      description: A host-local execution capacity group, with its point-in-time usage.
      properties:
        actorTypes:
          items:
            type: string
          type: array
        inUse:
          type: integer
        limit:
          type: integer
        name:
          type: string
      required:
      - actorTypes
      - inUse
      - limit
      - name
      type: object
    ChildLink:
      properties:
        instanceId:
          type: string
        workflow:
          type: string
      required:
      - instanceId
      - workflow
      type: object
    ClusterActivations:
      properties:
        errors:
          items:
            $ref: '#/components/schemas/HostError'
          type: array
        live:
          description: The number of in-memory activations reported by the hosts that
            answered
          type: integer
        partial:
          description: True when some hosts were unreachable or could not be queried,
            so `live` is a lower bound
          type: boolean
      required:
      - errors
      - live
      - partial
      type: object
    ClusterHosts:
      properties:
        connected:
          type: integer
        draining:
          type: integer
        total:
          type: integer
        unreachable:
          type: integer
      required:
      - connected
      - draining
      - total
      - unreachable
      type: object
    ClusterSummary:
      properties:
        activations:
          $ref: '#/components/schemas/ClusterActivations'
        exclusiveLease:
          allOf:
          - $ref: '#/components/schemas/ExclusiveLease'
          description: The holder of the cluster exclusive-access lease, `null` when
            none is held; while held, actions are refused
          nullable: true
        hosts:
          $ref: '#/components/schemas/ClusterHosts'
        jobs:
          additionalProperties:
            $ref: '#/components/schemas/BoundedCount'
          description: Job counts keyed by status (`pending`, `active`, `completed`,
            `dead`), with every key always present
          type: object
        observedAt:
          format: date-time
          type: string
        placements:
          description: Total placements across all hosts, from the provider
          type: integer
        runtimes:
          description: The number of runtime replicas with a live membership, `null`
            in the local topology
          nullable: true
          type: integer
        topology:
          description: '`remote` is a cluster of hosts connected to standalone runtime
            replicas; `local` is a cluster of hosts that embed the provider and talk
            to each other directly'
          enum:
          - remote
          - local
          type: string
        workflows:
          additionalProperties:
            additionalProperties:
              $ref: '#/components/schemas/BoundedCount'
            type: object
          description: Instance counts keyed by workflow name, then by status, omitting
            statuses with no instances
          type: object
      required:
      - activations
      - exclusiveLease
      - hosts
      - jobs
      - observedAt
      - placements
      - runtimes
      - topology
      - workflows
      type: object
    ControlRequest:
      description: Cancel requires a non-blank reason, suspend takes an optional one,
        and resume rejects a non-empty one with `400`.
      properties:
        reason:
          description: Why the instance is cancelled or suspended, at most 1024 bytes
          maxLength: 1024
          type: string
      type: object
    ControlResponse:
      properties:
        action:
          enum:
          - cancel
          - suspend
          - resume
          type: string
        coalesced:
          description: True when a control job of the same kind was already pending,
            so this request was merged into it and its reason was dropped
          type: boolean
        instanceId:
          type: string
        noEffect:
          description: True when the engine would ignore the request for the instance's
            status, so no job was dispatched
          type: boolean
        status:
          description: The instance status read before dispatching
          enum:
          - pending
          - running
          - suspended
          - compensating
          - completed
          - failed
          - cancelled
          type: string
        workflow:
          type: string
      required:
      - action
      - coalesced
      - instanceId
      - noEffect
      - status
      - workflow
      type: object
    DeactivateResponse:
      properties:
        actorId:
          type: string
        actorType:
          type: string
        hostId:
          description: The host the actor was placed on, omitted when no active placement
            was found
          type: string
        notActive:
          description: True when the actor was not active, so nothing was deactivated
          type: boolean
      required:
      - actorId
      - actorType
      - notActive
      type: object
    DrainRequest:
      properties:
        force:
          default: false
          description: Drain the host even when it is the last live server of one
            or more actor types
          type: boolean
        reason:
          description: A free-form reason of at most 1024 bytes, recorded in the audit
            log and passed to the host
          maxLength: 1024
          type: string
        timeout:
          description: A Go duration string (such as `30s`) bounding how long the
            host lets its actors' in-flight calls run before canceling them, positive
            and at most `5m`; the host still waits for the canceled calls to return
            before it unregisters, and when omitted it waits for every call to finish,
            with no time limit
          example: 30s
          type: string
      type: object
    DrainResponse:
      properties:
        alreadyDraining:
          description: True when the host was already draining
          type: boolean
        forcedActorTypes:
          description: The actor types left without a live server because the drain
            was forced, omitted when none
          items:
            type: string
          type: array
        hostId:
          type: string
      required:
      - alreadyDraining
      - hostId
      type: object
    Error:
      description: The body of every error response.
      properties:
        code:
          description: |-
            A machine-readable error code
            See the API description for the meaning of each code
          enum:
          - badRequest
          - unauthorized
          - forbidden
          - notFound
          - notApplicable
          - methodNotAllowed
          - exclusiveLeaseHeld
          - lastServer
          - hostUnavailable
          - hostReattached
          - noHostsReachable
          - eventHistoryDisabled
          - payloadTooLarge
          - stateNotDecodable
          - timeout
          - internal
          type: string
        details:
          additionalProperties: {}
          description: |-
            Additional machine-readable context, present for some codes:
            `lastServer` has `actorTypes` (array of strings);
            `noHostsReachable` has `errors` (array of `HostError`)
          type: object
        message:
          description: A human-readable description of the error
          type: string
        requestId:
          description: The request ID, also returned in the `X-Request-Id` header
          type: string
        retryable:
          description: Present and `true` when repeating the request later may succeed
          type: boolean
      required:
      - code
      - message
      type: object
    Event:
      properties:
        attempt:
          description: Omitted when zero
          type: integer
        child:
          $ref: '#/components/schemas/ChildLink'
        dueTime:
          description: The earliest time a scheduled attempt may run, when it is later
            than the event
          format: date-time
          type: string
        error:
          type: string
        eventName:
          description: The event a wait step waits for or received
          type: string
        iteration:
          description: The loop iteration of the step, omitted outside a loop body
          type: integer
        kind:
          description: The event kind, one of `instance_started`, `instance_suspended`,
            `instance_resumed`, `instance_reopened`, `instance_completed`, `instance_failed`,
            `instance_cancelled`, `cancel_requested`, `unwind_requested`, `compensation_started`,
            `parent_notified`, `step_started`, `step_completed`, `step_failed`, `step_skipped`,
            `step_compensating`, `step_compensated`, `step_compensation_failed`, `wait_started`,
            `event_received`, `task_dispatched`, `child_started`, `worker_started`,
            `worker_finished`, `task_retry_scheduled`, `task_completed`, `task_failed`,
            `task_abandoned`, `compensation_dispatched`, `child_unwind_requested`,
            `compensation_retry_scheduled`, `compensation_completed`, or `compensation_failed`;
            new kinds may be added
          type: string
        outcome:
          type: string
        reason:
          description: The reason of a cancel, unwind or suspend, or the cause of
            an unwind
          type: string
        seq:
          description: The event's sequence number within the instance
          type: integer
        step:
          type: string
        taskIndex:
          type: integer
        time:
          format: date-time
          type: string
        timeSource:
          description: How `time` was obtained
          enum:
          - engine
          - dispatch
          - report
          - worker
          type: string
        undo:
          description: Set when the event is about a compensation rather than the
            forward task, omitted when false
          type: boolean
      required:
      - kind
      - seq
      - time
      type: object
    ExclusiveLease:
      properties:
        expiresAt:
          format: date-time
          type: string
        owner:
          type: string
      required:
      - expiresAt
      - owner
      type: object
    Health:
      properties:
        status:
          enum:
          - ok
          type: string
      required:
      - status
      type: object
    Host:
      properties:
        actorTypeCount:
          type: integer
        address:
          type: string
        draining:
          type: boolean
        hostId:
          type: string
        lastHealthCheck:
          format: date-time
          type: string
        ownerRuntimeId:
          description: The runtime replica holding the host's session, or the runtime
            the host registered with, omitted when unknown (such as in the local topology)
          type: string
        placementCount:
          description: Total placements on the host across its actor types
          type: integer
        state:
          description: '`draining` when the host is draining (regardless of reachability),
            otherwise `unreachable` when no session to it is held, otherwise `connected`'
          enum:
          - connected
          - draining
          - unreachable
          type: string
      required:
      - actorTypeCount
      - address
      - draining
      - hostId
      - lastHealthCheck
      - placementCount
      - state
      type: object
    HostActivations:
      properties:
        activeCount:
          description: The number of matching activations on the host, across all
            pages
          type: integer
        hostId:
          type: string
        items:
          items:
            $ref: '#/components/schemas/Activation'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
        observedAt:
          format: date-time
          type: string
      required:
      - activeCount
      - hostId
      - items
      - observedAt
      type: object
    HostActorType:
      properties:
        actorType:
          type: string
        idleTimeoutMs:
          type: integer
        jobRetention:
          $ref: '#/components/schemas/Retention'
        placements:
          $ref: '#/components/schemas/Capacity'
      required:
      - actorType
      - idleTimeoutMs
      - jobRetention
      - placements
      type: object
    HostDetail:
      properties:
        actorTypeCount:
          type: integer
        actorTypes:
          items:
            $ref: '#/components/schemas/HostActorType'
          type: array
        address:
          type: string
        draining:
          type: boolean
        hostId:
          type: string
        lastHealthCheck:
          format: date-time
          type: string
        observedAt:
          format: date-time
          type: string
        ownerRuntimeId:
          description: The runtime replica holding the host's session, or the runtime
            the host registered with, omitted when unknown (such as in the local topology)
          type: string
        placementCount:
          description: Total placements on the host across its actor types
          type: integer
        runtime:
          allOf:
          - $ref: '#/components/schemas/HostRuntime'
          description: The host's own report, omitted when the host could not be queried
        runtimeError:
          allOf:
          - $ref: '#/components/schemas/HostError'
          description: Why the host could not be queried, omitted on success
        state:
          description: '`draining` when the host is draining (regardless of reachability),
            otherwise `unreachable` when no session to it is held, otherwise `connected`'
          enum:
          - connected
          - draining
          - unreachable
          type: string
      required:
      - actorTypeCount
      - actorTypes
      - address
      - draining
      - hostId
      - lastHealthCheck
      - observedAt
      - placementCount
      - state
      type: object
    HostError:
      properties:
        code:
          description: |-
            `hostUnavailable`, `hostReattached`, or `notApplicable`
            Any other failure, including a per-host timeout, is reported as `hostUnavailable`
          enum:
          - hostUnavailable
          - hostReattached
          - notApplicable
          type: string
        hostId:
          type: string
        message:
          type: string
      required:
      - code
      - hostId
      - message
      type: object
    HostRuntime:
      description: What a host reports about itself.
      properties:
        activeCount:
          description: The number of actors the host holds in memory
          type: integer
        capacityGroups:
          items:
            $ref: '#/components/schemas/CapacityGroup'
          type: array
        draining:
          type: boolean
        observedAt:
          format: date-time
          type: string
        workflows:
          description: The workflow definitions the host serves
          items:
            $ref: '#/components/schemas/WorkflowDefinition'
          type: array
      required:
      - activeCount
      - capacityGroups
      - draining
      - observedAt
      - workflows
      type: object
    Instance:
      properties:
        cause:
          description: Why the instance failed, was cancelled, or is compensating
          type: string
        compensation:
          description: The compensation outcome
          enum:
          - none
          - completed
          - partial
          - failed
          type: string
        completedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        dataRedacted:
          description: Present and `true` when `input` and `output` were withheld
            because the token lacks `workflows:data:read`
          type: boolean
        deadJobs:
          description: The orchestrator's dead-lettered jobs (at most 100), which
            the engine retries automatically, so an entry can be transient
          items:
            $ref: '#/components/schemas/Job'
          type: array
        definitionFingerprint:
          type: string
        eventHistory:
          description: False when the workflow opted out of event history
          type: boolean
        hasOutput:
          description: True when the instance stored an output, where a stored JSON
            `null` counts
          type: boolean
        input:
          description: The instance input as JSON, present only with the `workflows:data:read`
            scope and when an input was stored; any JSON value
          type: object
        instanceId:
          type: string
        output:
          description: The instance output as JSON, present only with the `workflows:data:read`
            scope and when `hasOutput` is true; any JSON value
          type: object
        parent:
          allOf:
          - $ref: '#/components/schemas/InstanceParent'
          description: Present for child instances
        startedAt:
          format: date-time
          type: string
        status:
          enum:
          - pending
          - running
          - suspended
          - compensating
          - completed
          - failed
          - cancelled
          type: string
        steps:
          items:
            $ref: '#/components/schemas/Step'
          type: array
        suspended:
          allOf:
          - $ref: '#/components/schemas/InstanceSuspension'
          description: Present while the instance is suspended
        terminalStatus:
          description: The status a compensating instance will terminate into
          type: string
        version:
          type: integer
        workflow:
          type: string
      required:
      - deadJobs
      - eventHistory
      - hasOutput
      - instanceId
      - status
      - steps
      - version
      - workflow
      type: object
    InstanceItem:
      properties:
        createdAt:
          description: Omitted when unknown
          format: date-time
          type: string
        instanceId:
          type: string
        parent:
          description: The parent label, for child instances
          type: string
        status:
          description: The instance status from its labels, or `unknown` when the
            instance has no labels
          type: string
        version:
          description: Omitted when unknown
          type: integer
      required:
      - instanceId
      - status
      type: object
    InstanceParent:
      properties:
        index:
          description: The task index within the parent's step
          type: integer
        instanceId:
          type: string
        step:
          description: The parent's step that started this instance
          type: string
        workflow:
          type: string
      required:
      - index
      - instanceId
      - workflow
      type: object
    InstanceSuspension:
      properties:
        at:
          format: date-time
          type: string
        reason:
          type: string
        resumeTo:
          description: The status the instance returns to when resumed
          type: string
      type: object
    Job:
      properties:
        actorId:
          type: string
        actorType:
          type: string
        attempts:
          description: The number of attempts, present only for terminal jobs (`completed`,
            `dead`)
          type: integer
        createdAt:
          description: Omitted when unknown
          format: date-time
          type: string
        cron:
          description: The cron expression, for cron jobs
          type: string
        dueTime:
          format: date-time
          type: string
        endedAt:
          description: When the job ended, only for terminal jobs and omitted when
            unknown
          format: date-time
          type: string
        interval:
          description: The repeat interval, for repeating jobs
          type: string
        jobId:
          type: string
        lastError:
          description: The last error, only for terminal jobs and omitted when empty
          type: string
        method:
          type: string
        status:
          description: '`dead` is dead-lettered'
          enum:
          - pending
          - active
          - completed
          - dead
          type: string
        workflow:
          allOf:
          - $ref: '#/components/schemas/WorkflowLink'
          description: Present for jobs of workflow actors
      required:
      - actorId
      - actorType
      - dueTime
      - jobId
      - method
      - status
      type: object
    Page-ActorStateItem:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActorStateItem'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-Alarm:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Alarm'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-Event:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Event'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-Host:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Host'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-InstanceItem:
      properties:
        items:
          items:
            $ref: '#/components/schemas/InstanceItem'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-Job:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Job'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-Placement:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Placement'
          type: array
        nextCursor:
          description: Opaque cursor to pass back as `cursor` to fetch the next page,
            omitted on the last page
          type: string
      required:
      - items
      type: object
    Page-Runtime:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Runtime'
          type: array
