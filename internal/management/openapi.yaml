components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        A read-only or management token from the server configuration, sent as `Authorization: Bearer <token>`.
        Read-only tokens grant every scope except those ending in `:manage`; management tokens grant every scope.

  headers:
    X-Request-Id:
      description: A unique ID assigned to the request, also returned as `requestId` in error bodies and recorded in audit logs.
      schema:
        type: string

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `nextCursor` by the previous page. Omit for the first page.
      schema:
        type: string
    HostId:
      name: hostId
      in: path
      required: true
      description: The host ID.
      schema:
        type: string
    ActorType:
      name: type
      in: path
      required: true
      description: The actor type. Must not contain `/`.
      schema:
        type: string
    ActorId:
      name: id
      in: path
      required: true
      description: The actor ID. Must not contain `/`.
      schema:
        type: string
    WorkflowName:
      name: name
      in: path
      required: true
      description: The workflow name. Must not contain `/` or `.`.
      schema:
        type: string
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: The workflow instance ID. Must not contain `/`.
      schema:
        type: string

  responses:
    BadRequest:
      description: "`badRequest`: an invalid path segment, query parameter, cursor, or request body."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "`unauthorized`: the bearer token is missing or unknown."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
        WWW-Authenticate:
          description: Always `Bearer realm="francis-management"`.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "`forbidden`: the token does not grant the scope the route requires."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "`notFound`: the resource does not exist. Some routes also return `notApplicable` (not available in this topology) or `eventHistoryDisabled`."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        One of:
        - `exclusiveLeaseHeld` (actions only): an exclusive-access lease is held on the cluster; `details.owner` and `details.expiresAt` describe it, and are omitted when the lease was released before it could be read; retryable.
        - `lastServer` (drain only): the host is the last live server of the actor types in `details.actorTypes`; set `force` to drain it anyway.
        - `hostReattached`: the host kept reconnecting, so the request could not be delivered to its current session; send it again; retryable.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: "`payloadTooLarge`: the request body exceeds 64 KiB."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: "`internal`: an unexpected server error."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: "`hostUnavailable`: the host (or the runtime owning its session) could not be reached, or `noHostsReachable`: none of the queried hosts could be reached (with `details.errors`). Retryable."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: "`timeout`: the request timed out. Retryable."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ControlAccepted:
      description: The control job was dispatched, or coalesced onto an identical pending one.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ControlResponse"
    ControlNoEffect:
      description: The engine would ignore the request for the instance's current status, so no job was dispatched (`noEffect` is `true`).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/X-Request-Id"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ControlResponse"

  schemas:
    Error:
      type: object
      description: The body of every error response.
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: A human-readable description of the error.
        requestId:
          type: string
          description: The request ID, also returned in the `X-Request-Id` header.
        retryable:
          type: boolean
          description: Present and `true` when repeating the request later may succeed. Omitted otherwise.
        details:
          type: object
          additionalProperties: true
          description: |
            Additional machine-readable context, present for some codes:
            - `lastServer`: `actorTypes` (array of strings).
            - `exclusiveLeaseHeld`: `owner` (string) and `expiresAt` (RFC 3339 timestamp).
            - `noHostsReachable`: `errors` (array of `HostError`).

    ErrorCode:
      type: string
      description: A machine-readable error code. See the API description for the meaning of each code.
      enum:
        - badRequest
        - unauthorized
        - forbidden
        - notFound
        - notApplicable
        - methodNotAllowed
        - exclusiveLeaseHeld
        - lastServer
        - hostUnavailable
        - hostReattached
        - noHostsReachable
        - eventHistoryDisabled
        - payloadTooLarge
        - stateNotDecodable
        - timeout
        - internal

    HostError:
      type: object
      description: A host that could not be queried by a fan-out request.
      required: [hostId, code, message]
      properties:
        hostId:
          type: string
        code:
          type: string
          description: "`hostUnavailable`, `hostReattached`, or `notApplicable`; any other failure (including a per-host timeout) is reported as `hostUnavailable`."
        message:
          type: string

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    Topology:
      type: string
      description: "`remote` is a cluster of hosts connected to standalone runtime replicas; `local` is a cluster of hosts that embed the provider and talk to each other directly."
      enum: [remote, local]

    HostState:
      type: string
      description: "`draining` when the host is draining (regardless of reachability), otherwise `unreachable` when no session to it is held, otherwise `connected`."
      enum: [connected, draining, unreachable]

    JobStatus:
      type: string
      description: "`dead` is dead-lettered."
      enum: [pending, active, completed, dead]

    WorkflowStatus:
      type: string
      enum: [pending, running, suspended, compensating, completed, failed, cancelled]

    BoundedCount:
      type: object
      description: A count that stops at 10,000.
      required: [count, truncated]
      properties:
        count:
          type: integer
        truncated:
          type: boolean
          description: True when the count reached the cap, so the real count is at least `count`.

    ExclusiveLease:
      type: object
      required: [owner, expiresAt]
      properties:
        owner:
          type: string
        expiresAt:
          type: string
          format: date-time

    ClusterSummary:
      type: object
      required: [topology, exclusiveLease, runtimes, hosts, placements, activations, jobs, workflows, observedAt]
      properties:
        topology:
          $ref: "#/components/schemas/Topology"
        exclusiveLease:
          description: The holder of the cluster exclusive-access lease, `null` when none is held. While held, actions are refused.
          oneOf:
            - $ref: "#/components/schemas/ExclusiveLease"
            - type: "null"
        runtimes:
          type: [integer, "null"]
          description: The number of runtime replicas with a live membership, `null` in the local topology.
        hosts:
          type: object
          required: [total, connected, draining, unreachable]
          properties:
            total:
              type: integer
            connected:
              type: integer
            draining:
              type: integer
            unreachable:
              type: integer
        placements:
          type: integer
          description: Total placements across all hosts, from the provider.
        activations:
          type: object
          required: [live, partial, errors]
          properties:
            live:
              type: integer
              description: The number of in-memory activations reported by the hosts that answered.
            partial:
              type: boolean
              description: True when some hosts were unreachable or could not be queried, so `live` is a lower bound.
            errors:
              type: array
              items:
                $ref: "#/components/schemas/HostError"
        jobs:
          type: object
          description: Job counts keyed by status (`pending`, `active`, `completed`, `dead`); every key is always present.
          propertyNames:
            $ref: "#/components/schemas/JobStatus"
          additionalProperties:
            $ref: "#/components/schemas/BoundedCount"
        workflows:
          type: object
          description: Instance counts keyed by workflow name, then by status. Statuses with no instances are omitted.
          additionalProperties:
            type: object
            propertyNames:
              $ref: "#/components/schemas/WorkflowStatus"
            additionalProperties:
              $ref: "#/components/schemas/BoundedCount"
        observedAt:
          type: string
          format: date-time

    Runtime:
      type: object
      required: [runtimeId, address, self, lastHeartbeat, expiresAt, connectedHosts]
      properties:
        runtimeId:
          type: string
        address:
          type: string
        self:
          type: boolean
          description: True for the replica serving this request.
        lastHeartbeat:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: When the replica's membership expires unless renewed.
        connectedHosts:
          type: [integer, "null"]
          description: The number of host sessions the replica holds, `null` when it could not be queried.
        error:
          type: string
          description: Set when the replica could not be queried.

    RuntimePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Runtime"
        nextCursor:
          type: string
          description: Never set for this endpoint.

    Host:
      type: object
      required: [hostId, address, state, draining, lastHealthCheck, actorTypeCount, placementCount]
      properties:
        hostId:
          type: string
        address:
          type: string
        state:
          $ref: "#/components/schemas/HostState"
        draining:
          type: boolean
        lastHealthCheck:
          type: string
          format: date-time
        ownerRuntimeId:
          type: string
          description: The runtime replica holding the host's session, or the runtime the host registered with. Omitted when unknown (such as in the local topology).
        actorTypeCount:
          type: integer
        placementCount:
          type: integer
          description: Total placements on the host across its actor types.

    HostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Host"
        nextCursor:
          type: string

    Capacity:
      type: object
      description: The placement usage of an actor type.
      required: [used, limit, available, unlimited]
      properties:
        used:
          type: integer
        limit:
          type: [integer, "null"]
          description: The placement limit, `null` when unlimited.
        available:
          type: [integer, "null"]
          description: The remaining placements (never negative), `null` when unlimited.
        unlimited:
          type: boolean

    RetentionPolicy:
      type: object
      description: Whether terminal jobs leave a record, and for how long.
      required: [recorded, forever]
      properties:
        recorded:
          type: boolean
          description: True when a record of the terminal job is kept.
        forever:
          type: boolean
          description: True when the record is kept indefinitely.
        retentionMs:
          type: integer
          format: int64
          description: How long the record is kept, in milliseconds. Omitted when zero.

    Retention:
      type: object
      required: [completedJobs, deadLetteredJobs]
      properties:
        completedJobs:
          $ref: "#/components/schemas/RetentionPolicy"
        deadLetteredJobs:
          $ref: "#/components/schemas/RetentionPolicy"

    HostActorType:
      type: object
      required: [actorType, idleTimeoutMs, placements, jobRetention]
      properties:
        actorType:
          type: string
        idleTimeoutMs:
          type: integer
          format: int64
        placements:
          $ref: "#/components/schemas/Capacity"
        jobRetention:
          $ref: "#/components/schemas/Retention"

    CapacityGroup:
      type: object
      description: A host-local execution capacity group, with its point-in-time usage.
      required: [name, limit, inUse, actorTypes]
      properties:
        name:
          type: string
        limit:
          type: integer
        inUse:
          type: integer
        actorTypes:
          type: array
          items:
            type: string

    WorkflowDefinition:
      type: object
      required: [name, version, fingerprint]
      properties:
        name:
          type: string
        version:
          type: integer
        fingerprint:
          type: string

    HostRuntime:
      type: object
      description: What a host reports about itself.
      required: [observedAt, activeCount, draining, capacityGroups, workflows]
      properties:
        observedAt:
          type: string
          format: date-time
        activeCount:
          type: integer
          description: The number of actors the host holds in memory.
        draining:
          type: boolean
        capacityGroups:
          type: array
          items:
            $ref: "#/components/schemas/CapacityGroup"
        workflows:
          type: array
          description: The workflow definitions the host serves.
          items:
            $ref: "#/components/schemas/WorkflowDefinition"

    HostDetail:
      allOf:
        - $ref: "#/components/schemas/Host"
        - type: object
          required: [actorTypes, observedAt]
          properties:
            actorTypes:
              type: array
              items:
                $ref: "#/components/schemas/HostActorType"
            runtime:
              $ref: "#/components/schemas/HostRuntime"
              description: The host's own report. Omitted when the host could not be queried.
            runtimeError:
              $ref: "#/components/schemas/HostError"
              description: Why the host could not be queried. Omitted on success.
            observedAt:
              type: string
              format: date-time

    Activation:
      type: object
      required: [hostId, actorType, actorId, activatedAt, deactivating, observedAt]
      properties:
        hostId:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        activatedAt:
          type: string
          format: date-time
        deactivating:
          type: boolean
        observedAt:
          type: string
          format: date-time
          description: When the host took the snapshot this activation comes from.

    HostActivations:
      type: object
      required: [hostId, observedAt, activeCount, items]
      properties:
        hostId:
          type: string
        observedAt:
          type: string
          format: date-time
        activeCount:
          type: integer
          description: The number of matching activations on the host, across all pages.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activation"
        nextCursor:
          type: string

    Activations:
      type: object
      required: [items, partial, errors, startedAt, finishedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Activation"
        nextCursor:
          type: string
        partial:
          type: boolean
          description: True when some hosts could not be queried, so their activations are missing.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/HostError"
        startedAt:
          type: string
          format: date-time
          description: When collection started.
        finishedAt:
          type: string
          format: date-time
          description: When collection finished.

    Placement:
      type: object
      required: [actorType, actorId, hostId, idleTimeoutMs]
      properties:
        actorType:
          type: string
        actorId:
          type: string
        hostId:
          type: string
        idleTimeoutMs:
          type: integer
          format: int64

    PlacementPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Placement"
        nextCursor:
          type: string

    ActorTypeHost:
      type: object
      required: [hostId, draining, idleTimeoutMs, placements, jobRetention]
      properties:
        hostId:
          type: string
        draining:
          type: boolean
        idleTimeoutMs:
          type: integer
          format: int64
        placements:
          $ref: "#/components/schemas/Capacity"
        jobRetention:
          $ref: "#/components/schemas/Retention"

    ActorTypeCapacityGroup:
      allOf:
        - type: object
          required: [hostId]
          properties:
            hostId:
              type: string
              description: The host that reported the group.
        - $ref: "#/components/schemas/CapacityGroup"

    ActorType:
      type: object
      required: [actorType, builtIn, placements, hosts, jobRetention, capacityGroups]
      properties:
        actorType:
          type: string
        builtIn:
          type: boolean
          description: True for actor types built into Francis, such as workflow actors.
        placements:
          $ref: "#/components/schemas/Capacity"
          description: The placement usage summed across the hosts serving the type; unlimited when any host is unlimited.
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/ActorTypeHost"
        jobRetention:
          description: The job retention, `null` when the hosts serving the type registered different retentions.
          oneOf:
            - $ref: "#/components/schemas/Retention"
            - type: "null"
        capacityGroups:
          type: array
          description: The capacity groups that include this type, one entry per reporting host.
          items:
            $ref: "#/components/schemas/ActorTypeCapacityGroup"

    ActorTypes:
      type: object
      required: [items, partial, errors, observedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorType"
        partial:
          type: boolean
          description: True when some hosts could not be queried, so their capacity groups are missing.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/HostError"
        observedAt:
          type: string
          format: date-time

    WorkflowLabels:
      type: object
      description: The labels the workflow engine stores with an orchestrator's state. Empty fields are omitted.
      properties:
        status:
          type: string
        version:
          type: integer
        parent:
          type: string
        created:
          type: string
          description: The creation time, in the stored label format (`2006-01-02T15:04:05.000000000Z`).

    ActorStateItem:
      type: object
      required: [actorId]
      properties:
        actorId:
          type: string
        workflowLabels:
          $ref: "#/components/schemas/WorkflowLabels"
          description: Present only for state that has workflow labels.

    ActorStateItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActorStateItem"
        nextCursor:
          type: string

    ActorState:
      type: object
      required: [actorType, actorId, size, lossy, state]
      properties:
        actorType:
          type: string
        actorId:
          type: string
        size:
          type: integer
          description: The size of the stored MessagePack value, in bytes.
        lossy:
          type: boolean
          description: True when any value used a rendering that cannot be converted back to the same MessagePack bytes.
        state:
          description: The stored value converted to JSON, following the convention described on the operation. Any JSON value.

    DeactivateResponse:
      type: object
      required: [actorType, actorId, notActive]
      properties:
        actorType:
          type: string
        actorId:
          type: string
        hostId:
          type: string
          description: The host the actor was placed on. Omitted when no active placement was found.
        notActive:
          type: boolean
          description: True when the actor was not active, so nothing was deactivated.

    DrainRequest:
      type: object
      additionalProperties: false
      properties:
        timeout:
          type: string
          description: A Go duration string (such as `30s`) bounding the host's graceful teardown; positive and at most `5m`. When omitted, the host waits for every actor to deactivate, with no time limit.
          examples: ["30s"]
        force:
          type: boolean
          default: false
          description: Drain the host even when it is the last live server of one or more actor types.
        reason:
          type: string
          maxLength: 1024
          description: A free-form reason, recorded in the audit log and passed to the host. At most 1024 bytes.

    DrainResponse:
      type: object
      required: [hostId, alreadyDraining]
      properties:
        hostId:
          type: string
        alreadyDraining:
          type: boolean
          description: True when the host was already draining.
        forcedActorTypes:
          type: array
          description: The actor types left without a live server because the drain was forced. Omitted when none.
          items:
            type: string

    WorkflowLink:
      type: object
      description: Links an actor of a workflow to its workflow instance, derived from the actor type and ID naming conventions.
      required: [workflow, role]
      properties:
        workflow:
          type: string
        role:
          type: string
          enum: [orchestrator, worker, undo, registry, other]
        capability:
          type: string
          description: The capability of a worker or undo actor type, when it has one.
        instanceId:
          type: string
          description: The workflow instance, for orchestrator, worker, and undo actors whose ID could be parsed.
        step:
          type: string
          description: The step, for worker and undo actors.
        taskIndex:
          type: integer
          description: The task index within the step, for worker and undo actors.

    Job:
      type: object
      required: [jobId, actorType, actorId, method, status, dueTime]
      properties:
        jobId:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        method:
          type: string
        status:
          $ref: "#/components/schemas/JobStatus"
        dueTime:
          type: string
          format: date-time
        interval:
          type: string
          description: The repeat interval, for repeating jobs.
        cron:
          type: string
          description: The cron expression, for cron jobs.
        createdAt:
          type: string
          format: date-time
          description: Omitted when unknown.
        attempts:
          type: integer
          description: The number of attempts. Present only for terminal jobs (`completed`, `dead`).
        lastError:
          type: string
          description: The last error. Only for terminal jobs, omitted when empty.
        endedAt:
          type: string
          format: date-time
          description: When the job ended. Only for terminal jobs, omitted when unknown.
        workflow:
          $ref: "#/components/schemas/WorkflowLink"
          description: Present for jobs of workflow actors.

    JobPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        nextCursor:
          type: string

    Alarm:
      type: object
      required: [alarmId, actorType, actorId, name, dueTime, leased]
      properties:
        alarmId:
          type: string
        actorType:
          type: string
        actorId:
          type: string
        name:
          type: string
        dueTime:
          type: string
          format: date-time
        interval:
          type: string
          description: The repeat interval, for repeating alarms.
        ttl:
          type: string
          format: date-time
          description: When a repeating alarm stops repeating. Omitted when unset.
        leased:
          type: boolean
          description: True when a host currently holds a lease on the alarm.
        leaseExpiration:
          type: string
          format: date-time
          description: When the lease expires. Present only when leased.
        leaseHostId:
          type: string
          description: The host holding the lease, which is the live host the alarm's actor is placed on. Omitted when not leased, or when the actor has no placement on a live host.

    AlarmPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Alarm"
        nextCursor:
          type: string

    WorkflowVersion:
      type: object
      required: [version, fingerprint, firstSeenAt, generation]
      properties:
        version:
          type: integer
        fingerprint:
          type: string
        firstSeenAt:
          type: string
          format: date-time
        generation:
          type: integer
          format: uint64

    WorkflowHostDefinition:
      type: object
      required: [version, fingerprint]
      properties:
        version:
          type: integer
        fingerprint:
          type: string

    WorkflowHost:
      type: object
      required: [hostId, draining, definitions]
      properties:
        hostId:
          type: string
        draining:
          type: boolean
        definitions:
          type: [array, "null"]
          description: The versions the host serves, `null` when the host could not be queried.
          items:
            $ref: "#/components/schemas/WorkflowHostDefinition"

    WorkflowConflict:
      type: object
      description: A version registered or served with more than one definition fingerprint.
      required: [version, fingerprints, hosts]
      properties:
        version:
          type: integer
        fingerprints:
          type: array
          items:
            type: string
        hosts:
          type: array
          description: The hosts serving the version (the registry itself is not listed).
          items:
            type: string

    Workflow:
      type: object
      required: [name, versions, hosts, conflicts]
      properties:
        name:
          type: string
        versions:
          type: array
          description: The versions recorded by the workflow's definition registry.
          items:
            $ref: "#/components/schemas/WorkflowVersion"
        hosts:
          type: array
          description: The live hosts serving the workflow's orchestrator.
          items:
            $ref: "#/components/schemas/WorkflowHost"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowConflict"

    Workflows:
      type: object
      required: [items, partial, errors, observedAt]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Workflow"
        partial:
          type: boolean
          description: True when some hosts could not be queried, so their definitions are missing.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/HostError"
        observedAt:
          type: string
          format: date-time

    InstanceItem:
      type: object
      required: [instanceId, status]
      properties:
        instanceId:
          type: string
        status:
          type: string
          description: The instance status from its labels, or `unknown` when the instance has no labels.
        version:
          type: integer
          description: Omitted when unknown.
        parent:
          type: string
          description: The parent label, for child instances.
        createdAt:
          type: string
          format: date-time
          description: Omitted when unknown.

    InstanceItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InstanceItem"
        nextCursor:
          type: string

    InstanceParent:
      type: object
      required: [instanceId, workflow, index]
      properties:
        instanceId:
          type: string
        workflow:
          type: string
        step:
          type: string
          description: The parent's step that started this instance.
        index:
          type: integer
          description: The task index within the parent's step.

    InstanceSuspension:
      type: object
      properties:
        reason:
          type: string
        at:
          type: string
          format: date-time
        resumeTo:
          type: string
          description: The status the instance returns to when resumed.

    ChildLink:
      type: object
      required: [workflow, instanceId]
      properties:
        workflow:
          type: string
        instanceId:
          type: string

    Step:
      type: object
      required: [name, kind, status, taskCount, tasksRemaining]
      properties:
        name:
          type: string
        kind:
          type: string
          description: The node kind, such as `step`, `parallel`, `foreach`, `child`, `wait`, or `loop`.
        status:
          type: string
          description: The step status, such as `pending`, `running`, `completed`, `failed`, `skipped`, `compensating`, `compensated`, or `compensation-failed`.
        iteration:
          type: integer
          description: The loop iteration. Omitted when zero.
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        error:
          type: string
        taskCount:
          type: integer
        tasksRemaining:
          type: integer
        children:
          type: array
          description: The child workflow instances started by this step. Omitted when none.
          items:
            $ref: "#/components/schemas/ChildLink"

    Instance:
      type: object
      required: [workflow, instanceId, status, version, hasOutput, steps, eventHistory, deadJobs]
      properties:
        workflow:
          type: string
        instanceId:
          type: string
        status:
          $ref: "#/components/schemas/WorkflowStatus"
        cause:
          type: string
          description: Why the instance failed, was cancelled, or is compensating.
        terminalStatus:
          type: string
          description: The status a compensating instance will terminate into.
        compensation:
          type: string
          description: The compensation outcome.
          enum: [none, completed, partial, failed]
        version:
          type: integer
        definitionFingerprint:
          type: string
        parent:
          $ref: "#/components/schemas/InstanceParent"
          description: Present for child instances.
        suspended:
          $ref: "#/components/schemas/InstanceSuspension"
          description: Present while the instance is suspended.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        hasOutput:
          type: boolean
          description: True when the instance stored an output (a stored JSON `null` counts).
        input:
          description: The instance input as JSON. Present only with the `workflows:data:read` scope, and only when an input was stored.
        output:
          description: The instance output as JSON. Present only with the `workflows:data:read` scope and when `hasOutput` is true.
        dataRedacted:
          type: boolean
          description: Present and `true` when `input` and `output` were withheld because the token lacks `workflows:data:read`.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        eventHistory:
          type: boolean
          description: False when the workflow opted out of event history.
        deadJobs:
          type: array
          description: The orchestrator's dead-lettered jobs (at most 100). The engine retries them automatically, so an entry can be transient.
          items:
            $ref: "#/components/schemas/Job"

    Event:
      type: object
      required: [seq, time, kind]
      properties:
        seq:
          type: integer
          format: int64
          description: The event's sequence number within the instance.
        time:
          type: string
          format: date-time
        timeSource:
          type: string
          description: How `time` was obtained.
          enum: [engine, dispatch, report, worker]
        kind:
          type: string
          description: |
            The event kind, one of: `instance_started`, `instance_suspended`, `instance_resumed`, `instance_reopened`, `instance_completed`, `instance_failed`, `instance_cancelled`, `cancel_requested`, `unwind_requested`, `compensation_started`, `parent_notified`, `step_started`, `step_completed`, `step_failed`, `step_skipped`, `step_compensating`, `step_compensated`, `step_compensation_failed`, `wait_started`, `event_received`, `task_dispatched`, `child_started`, `worker_started`, `worker_finished`, `task_retry_scheduled`, `task_completed`, `task_failed`, `task_abandoned`, `compensation_dispatched`, `child_unwind_requested`, `compensation_retry_scheduled`, `compensation_completed`, `compensation_failed`.
            New kinds may be added.
        step:
          type: string
        taskIndex:
          type: integer
        attempt:
          type: integer
          description: Omitted when zero.
        outcome:
          type: string
        error:
          type: string
        child:
          $ref: "#/components/schemas/ChildLink"
        iteration:
          type: integer
          description: The loop iteration of the step; omitted outside a loop body.
        undo:
          type: boolean
          description: Set when the event is about a compensation rather than the forward task; omitted when false.
        reason:
          type: string
          description: The reason of a cancel, unwind or suspend, or the cause of an unwind.
        eventName:
          type: string
          description: The event a wait step waits for or received.
        dueTime:
          type: string
          format: date-time
          description: The earliest time a scheduled attempt may run, when it is later than the event.

    EventPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        nextCursor:
          type: string

    CancelRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: Why the instance is cancelled. Required and not blank; at most 1024 bytes.

    SuspendRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1024
          description: Why the instance is suspended. At most 1024 bytes.

    ResumeRequest:
      type: object
      additionalProperties: false
      description: Resume takes no reason; a non-empty `reason` is rejected with `400`.
      properties:
        reason:
          type: string
          maxLength: 0

    ControlResponse:
      type: object
      required: [workflow, instanceId, action, coalesced, noEffect, status]
      properties:
        workflow:
          type: string
        instanceId:
          type: string
        action:
          type: string
          enum: [cancel, suspend, resume]
        coalesced:
          type: boolean
          description: True when a control job of the same kind was already pending, so this request was merged into it and its reason was dropped.
        noEffect:
          type: boolean
          description: True when the engine would ignore the request for the instance's status, so no job was dispatched.
        status:
          $ref: "#/components/schemas/WorkflowStatus"
          description: The instance status read before dispatching.
