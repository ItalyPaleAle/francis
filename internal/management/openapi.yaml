openapi: 3.1.0
info:
  title: Francis management API
  version: v1
  summary: Operational read and control API for a Francis actor cluster.
  description: |
    The management API exposes read-only views of a Francis cluster (hosts, runtimes, placements, in-memory activations, actor state, jobs, alarms, and workflows), plus a small set of audited actions (drain a host, deactivate an actor, cancel/suspend/resume a workflow instance).

    ## Authentication and scopes

    Every route under `/api/v1` requires an `Authorization: Bearer <token>` header, except `GET /api/v1/openapi.yaml`.
    Tokens are only accepted in the `Authorization` header, never in the query string.
    `GET /healthz` (served at the root, outside `/api/v1`) is also public.

    Each operation declares the scope it requires in its description and in the `x-required-scope` extension.
    The server is configured with two token lists:

    - **Read-only tokens** receive every scope except those ending in `:manage`.
    - **Management tokens** receive every scope.

    | Scope | Grants |
    | --- | --- |
    | `cluster:read` | Cluster summary, runtimes, hosts |
    | `actors:read` | Activations, placements, actor types, actor-state listings |
    | `actors:state:read` | Reading the stored state of an actor (audited) |
    | `workflows:read` | Workflows, instances, event history |
    | `workflows:data:read` | Including workflow instance input and output in instance details (audited) |
    | `jobs:read` | Jobs and alarms |
    | `actors:manage` | Deactivating an actor |
    | `hosts:manage` | Draining a host |
    | `workflows:manage` | Cancelling, suspending, and resuming workflow instances |

    A missing or unknown token yields `401` with a `WWW-Authenticate: Bearer realm="francis-management"` header; a valid token lacking the route's scope yields `403`.

    ## Pagination

    Paginated endpoints accept `limit` (1 to 1000, default 100) and an opaque `cursor`, and return `{ "items": [...], "nextCursor": "..." }`.
    `nextCursor` is omitted on the last page.
    Pass it back unchanged as `cursor` to fetch the next page; its contents are not part of the contract.
    A malformed cursor or an out-of-range limit yields `400 badRequest`.
    A page may contain fewer items than `limit` even when more pages follow (for example when a filter is applied after reading a page), so always rely on `nextCursor` to detect the end.

    ## Fan-out endpoints and partial results

    Some endpoints query every host's in-memory snapshot (`/activations`, `/actor-types`, `/workflows`, and the activation count of `/cluster/summary`).
    Hosts are queried concurrently with a per-host timeout, and a host that cannot be queried does not fail the request: the response sets `partial: true` and lists the host in `errors` (see `HostError`).
    Each host is sampled independently, so these responses are operational evidence rather than a transactionally consistent view of the cluster: an actor that moved during collection may appear twice or not at all, and actors may move between pages.
    Use `GET /hosts/{hostId}/activations` for the freshest view of one host.

    ## Errors

    Every error response has a JSON body described by the `Error` schema.
    Every response carries an `X-Request-Id` header, which is also echoed as `requestId` in error bodies and recorded in audit logs.
    Errors with `retryable: true` may succeed if the request is repeated later.

    Error `code` values:

    | Code | Status | Meaning |
    | --- | --- | --- |
    | `badRequest` | 400 | Invalid path segment, query parameter, cursor, or request body |
    | `unauthorized` | 401 | Missing or unknown bearer token |
    | `forbidden` | 403 | The token does not grant the route's scope |
    | `notFound` | 404 | The resource does not exist, or no such route |
    | `notApplicable` | 404 | The resource does not exist in this topology (for example runtimes in the local topology) |
    | `eventHistoryDisabled` | 404 | The workflow opted out of event history |
    | `methodNotAllowed` | 405 | The path exists but does not serve the method; the `Allow` header lists the methods it serves |
    | `lastServer` | 409 | Draining the host would leave one or more actor types without a live server; `details.actorTypes` lists them |
    | `exclusiveLeaseHeld` | 409 | An exclusive-access lease is held on the cluster (for example during a restore), so actions are refused; `details.owner` and `details.expiresAt` describe it, and are omitted when the lease was released before it could be read; retryable |
    | `hostReattached` | 409 | The host kept reconnecting, so the request could not be delivered to its current session; send it again; retryable |
    | `payloadTooLarge` | 413 | The request body is larger than 64 KiB |
    | `stateNotDecodable` | 422 | The stored actor state cannot be rendered as JSON, because it is not valid MessagePack or a map has two keys that would share a JSON name |
    | `internal` | 500 | Unexpected server error |
    | `hostUnavailable` | 503 | The host, or the runtime owning its session, could not be reached; retryable |
    | `noHostsReachable` | 503 | None of the queried hosts could be reached; `details.errors` lists them; retryable |
    | `timeout` | 504 | The request timed out; retryable |
  license:
    name: See repository
servers:
  - url: /api/v1
    description: Management API, relative to the management listener
security:
  - bearerAuth: []
tags:
  - name: Meta
    description: Public endpoints.
  - name: Cluster
    description: Cluster-wide summary, runtime replicas, and hosts.
  - name: Actors
    description: Activations, placements, actor types, and actor state.
  - name: Jobs
    description: Durable jobs and alarms.
  - name: Workflows
    description: Workflow definitions, instances, and event history.
  - name: Actions
    description: Audited operations that change cluster state.

paths:
  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPI
      summary: Get this OpenAPI document
      description: |
        Returns this document as YAML.
        Public: no bearer token is required.
      security: []
      x-required-scope: null
      responses:
        "200":
          description: The OpenAPI document.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/yaml:
              schema:
                type: string

  /healthz:
    servers:
      - url: /
        description: Served at the root of the management listener, outside `/api/v1`
    get:
      tags: [Meta]
      operationId: getHealthz
      summary: Liveness check
      description: |
        Served at `GET /healthz`, outside `/api/v1`.
        Public: no bearer token is required.
        Always returns `{"status":"ok"}` while the server is running.
      security: []
      x-required-scope: null
      responses:
        "200":
          description: The server is running.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /cluster/summary:
    get:
      tags: [Cluster]
      operationId: getClusterSummary
      summary: Get a cluster summary
      description: |
        Requires scope `cluster:read`.

        Summarizes the cluster: topology, exclusive-access lease, runtime replicas, hosts by state, placements, live activations, jobs by status, and workflow instances by status.
        Job and workflow instance counts stop at 10,000 per bucket (`truncated: true` then means the real count is at least `count`).
        The live activation count is collected from the hosts that are not unreachable; when some host could not be queried, `activations.partial` is `true` and `activations.live` is a lower bound.
        The counts are gathered from separate reads and are not transactionally consistent with each other.
      x-required-scope: cluster:read
      responses:
        "200":
          description: The cluster summary.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /runtimes:
    get:
      tags: [Cluster]
      operationId: listRuntimes
      summary: List runtime replicas
      description: |
        Requires scope `cluster:read`.

        Lists the runtime replicas with a live membership, sorted by runtime ID, with the number of host sessions each holds.
        The response uses the page envelope, but is never paginated (`nextCursor` is always omitted) and takes no `limit` or `cursor`.
        In the local topology there are no runtime replicas, and the endpoint returns `404 notApplicable`.
      x-required-scope: cluster:read
      responses:
        "200":
          description: The runtime replicas.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /hosts:
    get:
      tags: [Cluster]
      operationId: listHosts
      summary: List hosts
      description: |
        Requires scope `cluster:read`.

        Lists the hosts with a live registration, ordered by host ID.
        The `state` filter is applied to each page after it is read, so a filtered page may hold fewer items than `limit` while more pages follow.
      x-required-scope: cluster:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: state
          in: query
          required: false
          description: Only return hosts in this state.
          schema:
            $ref: "#/components/schemas/HostState"
      responses:
        "200":
          description: A page of hosts.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /hosts/{hostId}:
    parameters:
      - $ref: "#/components/parameters/HostId"
    get:
      tags: [Cluster]
      operationId: getHost
      summary: Get a host
      description: |
        Requires scope `cluster:read`.

        Returns a host's registration, the actor types it serves with their placement usage and job retention, and the host's own report of its execution capacity and served workflow definitions.
        The host's report is fetched live; when the host cannot be queried, `runtime` is omitted and `runtimeError` describes the failure, while the rest of the response is still returned with `200`.
      x-required-scope: cluster:read
      responses:
        "200":
          description: The host.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /hosts/{hostId}/activations:
    parameters:
      - $ref: "#/components/parameters/HostId"
    get:
      tags: [Actors]
      operationId: listHostActivations
      summary: List the in-memory activations of one host
      description: |
        Requires scope `actors:read`.

        Asks the host directly for a page of the actors it holds in memory, ordered by actor type and then actor ID.
        This is the freshest view of a single host; unlike `/activations`, a host that cannot be reached fails the request with `503 hostUnavailable`.
        `activeCount` is the number of matching activations on the host, across all pages.
      x-required-scope: actors:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          required: false
          description: Only return activations of this actor type.
          schema:
            type: string
      responses:
        "200":
          description: A page of the host's activations.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostActivations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /hosts/{hostId}/drain:
    parameters:
      - $ref: "#/components/parameters/HostId"
    post:
      tags: [Actions]
      operationId: drainHost
      summary: Drain a host
      description: |
        Requires scope `hosts:manage`. The action is audited, including its reason.

        Marks the host draining in the provider, so no new actor is placed on it anywhere, then asks the host to drain and returns `202` once the host acknowledged.
        The host then deactivates its actors gracefully, bounded by `timeout`; the drain continues after the response is sent.

        - Draining a host that is the last live, non-draining server of one or more actor types is refused with `409 lastServer` (with `details.actorTypes`), unless `force` is `true`; a forced drain lists those types in `forcedActorTypes`. The check is atomic with other drain requests, so concurrent drains of the last servers of a type can't both succeed without `force`.
        - Repeating a drain on a host that is already draining is never refused, and `alreadyDraining` reports whether the host was already draining.
        - While an exclusive-access lease is held on the cluster, the action is refused with `409 exclusiveLeaseHeld`.
        - If the host reconnected before it received the request, including to another runtime replica, the request is sent again to its new session; only if the host keeps reconnecting is the response `409 hostReattached`, and the request can be sent again.
        - When the request to the host fails, the host is asked whether it is draining. A host that is draining accepted the drain and the response is `202`. A host that is not draining has its draining mark removed, and the error has `details.hostDraining: false`. A host that can't be asked keeps its mark, since it may have accepted the drain, and the error has `details.hostDraining: true`.

        The request body is optional; an empty body is equivalent to `{}`.
        Unknown fields are rejected.
      x-required-scope: hosts:manage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrainRequest"
      responses:
        "202":
          description: The host accepted the drain request.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrainResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /activations:
    get:
      tags: [Actors]
      operationId: listActivations
      summary: List in-memory activations across hosts
      description: |
        Requires scope `actors:read`.

        Walks the hosts in host ID order, querying a batch of hosts concurrently, until the page is full.
        Items are ordered by host, then by actor type and actor ID within each host.

        This is a fan-out endpoint: a host that cannot be queried is reported in `errors` and sets `partial: true`, and its activations are missing from the page.
        If every queried host failed, the response is `503 noHostsReachable` with the host errors in `details.errors`.
        Each host is sampled independently, so the listing is not transactionally consistent: an actor that moved between hosts during collection or between pages may be listed twice or not at all.
      x-required-scope: actors:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: type
          in: query
          required: false
          description: Only return activations of this actor type.
          schema:
            type: string
        - name: host
          in: query
          required: false
          description: Only query this host. Returns `404 notFound` when the host is not registered.
          schema:
            type: string
      responses:
        "200":
          description: A page of activations.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activations"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /placements:
    get:
      tags: [Actors]
      operationId: listPlacements
      summary: List actor placements
      description: |
        Requires scope `actors:read`.

        Lists the placements recorded in the provider, ordered by actor type and then actor ID.
        A placement records which host an actor is assigned to; it does not prove the actor is currently in memory (see `/activations`).
      x-required-scope: actors:read
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: host
          in: query
          required: false
          description: Only return placements on this host.
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: Only return placements of this actor type.
          schema:
            type: string
      responses:
        "200":
          description: A page of placements.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /actor-types:
    get:
      tags: [Actors]
      operationId: listActorTypes
      summary: List actor types
      description: |
        Requires scope `actors:read`.

        Aggregates the actor types registered by every live host, sorted by actor type, with per-host placement usage and job retention, and the execution capacity groups the hosts report.
        Not paginated.

        This is a fan-out endpoint for the capacity groups: a host that cannot be queried is reported in `errors`, sets `partial: true`, and contributes no `capacityGroups` entries (its registration is still listed under `hosts`).
      x-required-scope: actors:read
      responses:
        "200":
          description: The actor types.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorTypes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /actor-states:
    get:
      tags: [Actors]
      operationId: listActorStates
      summary: List the actors of a type that have stored state
      description: |
        Requires scope `actors:read`.

        Lists the IDs of the actors of one type that have stored state, ordered by actor ID, with their workflow labels when the state belongs to a workflow orchestrator.
        The state itself is not returned; use `GET /actor-states/{type}/{id}`.
      x-required-scope: actors:read
      parameters:
        - name: type
          in: query
          required: true
          description: The actor type. Must not be empty and must not contain `/`.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of actors with stored state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorStateItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /actor-states/{type}/{id}:
    parameters:
      - $ref: "#/components/parameters/ActorType"
      - $ref: "#/components/parameters/ActorId"
    get:
      tags: [Actors]
      operationId: getActorState
      summary: Read an actor's stored state
      description: |
        Requires scope `actors:state:read`. Every read is audited (the data itself is never logged).

        Actor state is stored as MessagePack.
        By default it is converted to JSON and returned inside an `ActorState` envelope.
        Send `Accept: application/msgpack` (also accepted: `application/x-msgpack`, `application/vnd.msgpack`) to receive the exact stored bytes instead, with `Content-Type: application/msgpack`.
        Quality values are honored: the bytes are returned only when a MessagePack type is listed by name with a quality above zero and at least as high as the quality of JSON, so `*/*` alone keeps the JSON envelope.

        JSON conversion convention:

        | MessagePack | JSON | Lossy |
        | --- | --- | --- |
        | nil, bool, array, map with UTF-8 string keys | `null`, boolean, array, object (MessagePack field names are the keys) | no |
        | integer within ±2^53 | number | no |
        | string that is valid UTF-8 | string | no |
        | float (32 or 64 bit), finite | number | no |
        | integer beyond ±2^53 | decimal string, such as `"18446744073709551615"` | yes |
        | float NaN, +Inf, -Inf | string `"NaN"`, `"Infinity"`, `"-Infinity"` | yes |
        | bin, or string that is not valid UTF-8 | `{"$binary": "<standard base64>"}` | yes |
        | timestamp extension (type -1) | RFC 3339 string in UTC with nanoseconds, such as `"2026-01-02T03:04:05.123456789Z"` | yes |
        | any other extension | `{"$ext": <type>, "data": "<standard base64>"}` | yes |
        | map key that is not a UTF-8 string | the key's JSON rendering, as a string key | yes |

        `lossy` is `true` when any value used a rendering that cannot be converted back to the same MessagePack bytes; request MessagePack when exactness matters.
        If the stored bytes are not a single valid MessagePack value (or are nested more than 512 levels deep), the JSON rendering fails with `422 stateNotDecodable`; the raw bytes can still be read with `Accept: application/msgpack`.
        The same happens when two keys of a map would become the same JSON name, such as `1` and `"1"` or the same key stored twice, since JSON parsers disagree on which value they keep.
      x-required-scope: actors:state:read
      parameters:
        - name: Accept
          in: header
          required: false
          description: Send `application/msgpack` to receive the raw stored bytes instead of the JSON envelope. A MessagePack type with `q=0`, or with a lower quality than JSON, keeps the JSON envelope.
          schema:
            type: string
      responses:
        "200":
          description: The actor's state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorState"
            application/msgpack:
              schema:
                type: string
                contentMediaType: application/msgpack
                description: The exact stored MessagePack bytes.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: "`stateNotDecodable`: the stored state cannot be rendered as JSON, because it is not valid MessagePack or a map has two keys that would share a JSON name."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/GatewayTimeout"

  /actors/{type}/{id}/deactivate:
    parameters:
      - $ref: "#/components/parameters/ActorType"
      - $ref: "#/components/parameters/ActorId"
    post:
      tags: [Actions]
      operationId: deactivateActor
      summary: Deactivate an actor
      description: |
        Requires scope `actors:manage`. The action is audited.

        Looks up the host the actor is actively placed on (without creating a placement), and asks that host to halt the actor, returning `200` once the host acknowledged.
        The actor's stored state is kept; it is re-activated on its next invocation.

        - When the actor is not active anywhere, or its host went away since the lookup, the response is `200` with `notActive: true` and no request is sent to a host.
        - When the host reports the actor was not active, the response is `200` with `notActive: true` and `hostId` set.
        - While an exclusive-access lease is held on the cluster, the action is refused with `409 exclusiveLeaseHeld`.
        - If the host reconnected before it received the request, including to another runtime replica, the request is sent again to its new session; only if the host keeps reconnecting is the response `409 hostReattached`, and the request can be sent again.

        The request body is not read.
      x-required-scope: actors:manage
      responses:
        "200":
          description: The actor was deactivated, or was not active.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/X-Request-Id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivateResponse"
