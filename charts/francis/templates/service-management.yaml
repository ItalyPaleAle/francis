{{- include "francis.validateValues" . -}}
{{- if .Values.management.enabled }}
{{- $svc := .Values.management.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "francis.managementServiceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "francis.labels" . | nindent 4 }}
  {{- if or $svc.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $svc.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  {{- /* Kept apart from the UDP runtime Service, because a LoadBalancer mixing TCP and UDP needs MixedProtocolLBService */}}
  type: {{ $svc.type }}
  {{- /* The API server rejects externalTrafficPolicy on a ClusterIP Service */}}
  {{- if and $svc.externalTrafficPolicy (has $svc.type (list "NodePort" "LoadBalancer")) }}
  externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
  {{- end }}
  {{- if eq $svc.type "LoadBalancer" }}
  {{- with $svc.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  {{- with $svc.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ports:
    - name: management
      port: {{ int .Values.management.port }}
      targetPort: management
      protocol: TCP
      {{- if and $svc.nodePort (has $svc.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ int $svc.nodePort }}
      {{- end }}
  selector:
    {{- include "francis.selectorLabels" . | nindent 4 }}
{{- end }}
