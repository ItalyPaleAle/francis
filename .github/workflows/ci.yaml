name: "CI Test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  GOLANGCI_LINT_VERSION: "v2.12.2"

permissions:
  contents: "read"

jobs:
  tests:
    runs-on: "ubuntu-latest"

    services:
      postgres:
        image: "postgres:17-alpine"
        env:
          POSTGRES_USER: "actors"
          POSTGRES_PASSWORD: "actors"
          POSTGRES_DB: "actors"
        ports:
          - "5432:5432"
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_CONNSTRING: "postgres://actors:actors@localhost:5432/actors"
      TEST_STANDALONE_POSTGRES_CONNSTRING: "postgres://actors:actors@localhost:5432/actors"

    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: "go.mod"

      - name: Check Go dependency minimum age
        run: |
          go tool gomod-age

      - name: "Lint"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # 9.3.0
        with:
          version: "${{ env.GOLANGCI_LINT_VERSION }}"

      - name: "Test"
        run: |
          go test -v -tags unit ./...

      - name: "Integration tests"
        run: |
          go test -tags integration -v -count=1 -timeout 15m ./tests/integration/...

  tests-windows:
    runs-on: "windows-latest"

    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: "go.mod"

      - name: "Test"
        run: |
          go test -v -tags unit ./...

      - name: "Integration tests"
        run: |
          go test -tags integration -v -count=1 -timeout 15m ./tests/integration/...
