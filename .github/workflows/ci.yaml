name: "CI Test"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  HELM_VERSION: "v4.2.4"
  KIND_VERSION: "v0.29.0"

permissions:
  contents: "read"

jobs:
  tests:
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    services:
      postgres:
        image: "postgres:17-alpine"
        env:
          POSTGRES_USER: "actors"
          POSTGRES_PASSWORD: "actors"
          POSTGRES_DB: "actors"
        ports:
          - "5432:5432"
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_CONNSTRING: "postgres://actors:actors@localhost:5432/actors"
      TEST_STANDALONE_POSTGRES_CONNSTRING: "postgres://actors:actors@localhost:5432/actors"

    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            tests/e2e/go.sum

      - name: Check Go dependency minimum age
        run: |
          go tool gomod-age

      - name: "Check the management API's OpenAPI document is up to date"
        run: |
          make check-openapi-diff

      - name: "Read lint version"
        id: lint-version
        run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"

      - name: "Lint"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # 9.3.0
        with:
          version: "${{ steps.lint-version.outputs.version }}"

      - name: "Lint E2E"
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # 9.3.0
        with:
          version: "${{ steps.lint-version.outputs.version }}"
          working-directory: "tests/e2e"

      - name: "Test"
        # On Linux, run tests with -race
        run: |
          go test -v -race -tags unit ./...

      - name: "Integration tests"
        run: |
          go test -tags integration -v -count=1 -timeout 15m ./tests/integration/...

  dashboard:
    runs-on: "ubuntu-latest"
    timeout-minutes: 20

    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Playwright tests run against the runtime and a fixture host, built from source
      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: "Set up Node.js and pnpm"
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          package-json-file: "dashboard/package.json"
          cache: true
          cache-dependency-path: "dashboard/pnpm-lock.yaml"

      - name: "Install dashboard dependencies"
        working-directory: "dashboard"
        run: |
          pnpm install --frozen-lockfile

      - name: "Check the dashboard"
        working-directory: "dashboard"
        run: |
          pnpm run check:ci
          pnpm run svelte-check
          pnpm run test

      - name: "Install the Playwright browsers"
        working-directory: "dashboard"
        run: |
          pnpm run e2e:install

      # This builds the dashboard, then the runtime that embeds it
      - name: "Run the Playwright tests"
        working-directory: "dashboard"
        run: |
          pnpm run e2e

      - name: "Upload the Playwright results"
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "dashboard-playwright"
          path: |
            dashboard/test-results
            .bin/e2e/cluster.log
          retention-days: 7

  tests-windows:
    runs-on: "windows-latest"
    timeout-minutes: 30

    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: "go.mod"

      - name: "Test"
        run: |
          go test -v -tags unit ./...

      - name: "Integration tests"
        run: |
          go test -tags integration -v -count=1 -timeout 15m ./tests/integration/...

  e2e:
    name: "K8s E2E (${{ matrix.database }}, ${{ matrix.authentication }})"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: "sqlite"
            authentication: "jwt"
          - database: "postgres"
            authentication: "jwt"
          - database: "postgres"
            authentication: "psk"

    env:
      TEST_NAMESPACE: "francis-e2e-${{ matrix.database }}-${{ matrix.authentication }}"
      RUNTIME_IMAGE_REPOSITORY: "francis-e2e"
      RUNTIME_IMAGE_TAG: "local"
      TEST_IMAGE_PREFIX: "francis-e2e-"
      TEST_IMAGE_TAG: "local"
      KIND_CLUSTER_NAME: "francis-e2e"

    steps:
      - name: "Check out code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            tests/e2e/go.sum

      - name: "Install Helm and Kind"
        run: |
          set -eo pipefail

          HELM_TARBALL="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}"
          curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}.sha256sum"
          sha256sum -c "${HELM_TARBALL}.sha256sum"
          tar -xzf "${HELM_TARBALL}" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm

          KIND_BINARY="kind-linux-amd64"
          curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}"
          curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/${KIND_BINARY}.sha256sum"
          sha256sum -c "${KIND_BINARY}.sha256sum"
          sudo install -m 0755 "${KIND_BINARY}" /usr/local/bin/kind

          helm version
          kind version

      - name: "Start Kind"
        run: |
          kind create cluster --name "${KIND_CLUSTER_NAME}" --wait 3m

      - name: "Build E2E runtime image"
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p .bin/linux-amd64
          GOOS=linux GOARCH=amd64 \
            go build -trimpath -o .bin/linux-amd64/francis ./cmd/runtime

          docker build --build-arg TARGETARCH=amd64 \
            -t "${RUNTIME_IMAGE_REPOSITORY}:${RUNTIME_IMAGE_TAG}" .

      - name: "Load E2E runtime image"
        run: |
          kind load docker-image --name "${KIND_CLUSTER_NAME}" \
            "${RUNTIME_IMAGE_REPOSITORY}:${RUNTIME_IMAGE_TAG}"

      - name: "Run Helm E2E tests"
        run: |
          go run ./tests/e2e/testhelper \
            --database "${{ matrix.database }}" \
            --authentication "${{ matrix.authentication }}" \
            --namespace "${TEST_NAMESPACE}" \
            --runtime-image-repository "${RUNTIME_IMAGE_REPOSITORY}" \
            --runtime-image-tag "${RUNTIME_IMAGE_TAG}" \
            --test-image-prefix "${TEST_IMAGE_PREFIX}" \
            --test-image-tag "${TEST_IMAGE_TAG}" \
            --image-pull-policy Never \
            --container-engine docker \
            --target-arch amd64 \
            --kind-cluster "${KIND_CLUSTER_NAME}" \
            --keep-namespace

      - name: "Collect E2E diagnostics"
        if: always()
        run: |
          helm status francis --namespace "${TEST_NAMESPACE}" || true
          kubectl --namespace "${TEST_NAMESPACE}" get pods,services,deployments,statefulsets,pvc -o wide || true
          kubectl --namespace "${TEST_NAMESPACE}" describe pods || true
          kubectl --namespace "${TEST_NAMESPACE}" logs -l app.kubernetes.io/instance=francis --all-containers --prefix --tail=-1 || true
          kubectl --namespace "${TEST_NAMESPACE}" logs -l app.kubernetes.io/name=francis-e2e-postgres --all-containers --prefix --tail=-1 || true
