name: Build and release

on:
  push:
    branches:
      - main
    tags:
      # Push to tags matching v*
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all_platforms:
        description: Build binaries and container images for all supported platforms
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:

  build:
    name: Build and release
    runs-on: ubuntu-latest

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # 7.0.0
        with:
          go-version-file: 'go.mod'
          # Do not cache in release workflows
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # 4.2.0
        with:
          # Do not cache in release workflows
          cache-binary: false

      # Lowercase REPO_OWNER which is required for containers
      - name: Set lowercase REPO_OWNER
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          echo "REPO_OWNER=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Generate Container tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/francis
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch

      - name: Set variables
        run: |
          BUILD_ID=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          COMMIT_HASH=$(echo "${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}" | head -c 7)

          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV

          echo "BUILD_ID: '$BUILD_ID'"
          echo "BUILD_VERSION: '$BUILD_VERSION'"
          echo "BUILD_DATE: '$BUILD_DATE'"
          echo "COMMIT_HASH: '$COMMIT_HASH'"

          BUILDINFO_PKG="github.com/italypaleale/francis/internal/buildinfo"
          BUILD_LDFLAGS="-s -w -X ${BUILDINFO_PKG}.Production=1 -X ${BUILDINFO_PKG}.AppVersion=${BUILD_VERSION} -X ${BUILDINFO_PKG}.BuildId=${BUILD_ID} -X ${BUILDINFO_PKG}.BuildDate=${BUILD_DATE} -X ${BUILDINFO_PKG}.CommitHash=${COMMIT_HASH} -buildid=${BUILD_ID}"

          echo "BUILD_LDFLAGS=$BUILD_LDFLAGS" >> $GITHUB_ENV

          echo "BUILD_LDFLAGS: '$BUILD_LDFLAGS'"

      - name: Select build platforms
        env:
          INPUT_BUILD_ALL_PLATFORMS: ${{ inputs.build_all_platforms }}
        run: |
          build_all_platforms=false
          container_platforms='linux/amd64,linux/arm64/v8'

          if [[ "${GITHUB_REF}" =~ ^refs/tags/v ]]; then
            build_all_platforms=true
            container_platforms='linux/amd64,linux/arm64/v8,linux/arm/v7'
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_BUILD_ALL_PLATFORMS}" == 'true' ]]; then
            build_all_platforms=true
            container_platforms='linux/amd64,linux/arm64/v8,linux/arm/v7'
          fi

          echo "BUILD_ALL_PLATFORMS=$build_all_platforms" >> "$GITHUB_ENV"
          echo "CONTAINER_PLATFORMS=$container_platforms" >> "$GITHUB_ENV"

          echo "BUILD_ALL_PLATFORMS: '$build_all_platforms'"
          echo "CONTAINER_PLATFORMS: '$container_platforms'"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # 4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p .bin .out

          ./scripts/build-binaries.sh linux-amd64
          ./scripts/build-binaries.sh linux-arm64

          if [[ "${BUILD_ALL_PLATFORMS}" == 'true' ]]; then
            for target in linux-armv7 macos-arm64 windows-x64 windows-arm64 freebsd-amd64 freebsd-arm64; do
              ./scripts/build-binaries.sh "${target}"
            done
          else
            echo -e "\n###\nSkipping non-default platforms for this run\n"
          fi

          echo -e "\n###\nLinks for Docker buildx\n"
          (
            cd .bin && \
            ln -v -s francis-${{ env.BUILD_ID }}-linux-amd64 linux-amd64 && \
            ln -v -s francis-${{ env.BUILD_ID }}-linux-arm64 linux-arm64
          )

          if [[ "${BUILD_ALL_PLATFORMS}" == 'true' ]]; then
            (
              cd .bin && \
              ln -v -s francis-${{ env.BUILD_ID }}-linux-armv7 linux-arm
            )
          fi

          echo -e "\n###\nCompilation done\n"
          echo ".bin:"
          ls -al .bin
          echo ".out:"
          ls -al .out

      - name: Generate checksums
        working-directory: .out
        run: |
          shopt -s nullglob
          files=(francis-*.tar.gz francis-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No release archives found in .out"
            exit 1
          fi

          sha256sum "${files[@]}" | sort -k 2 > checksums.txt

          echo "checksums.txt:"
          cat checksums.txt

      - name: Build and push Container images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # 7.3.0
        id: docker-build-push
        with:
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.CONTAINER_PLATFORMS }}
          context: .
          file: Dockerfile
          push: true

      # A single attestation covering every file attached to the release: the archives plus checksums.txt
      - name: Attestation for release archives
        id: attest-archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: '.out/*'

      - name: Publish binaries as Actions Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # 7.0.1
        with:
          name: artifacts
          path: .out
          include-hidden-files: true
          compression-level: 0

      - name: Container image attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/francis'
          subject-digest: ${{ steps.docker-build-push.outputs.digest }}
          push-to-registry: true

  helm-chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest

    # The chart pins the container image by its appVersion, so it is only published once that image exists
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    env:
      HELM_VERSION: "v4.2.4"

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      # Lowercase REPO_OWNER which is required for containers
      - name: Set lowercase REPO_OWNER
        run: |
          REPO_OWNER=${{ github.repository_owner }}
          echo "REPO_OWNER=${REPO_OWNER,,}" >>${GITHUB_ENV}

      - name: Install Helm
        run: |
          set -eo pipefail

          HELM_TARBALL="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}"
          curl -fsSLO "https://get.helm.sh/${HELM_TARBALL}.sha256sum"
          sha256sum -c "${HELM_TARBALL}.sha256sum"

          tar -xzf "${HELM_TARBALL}" linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          rm -rf "${HELM_TARBALL}" "${HELM_TARBALL}.sha256sum" linux-amd64

          helm version

      - name: Set variables
        run: |
          # The chart is released alongside the runtime, so its version and appVersion both track the release tag
          CHART_VERSION="${GITHUB_REF_NAME#v}"

          echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_ENV

          echo "CHART_VERSION: '$CHART_VERSION'"

      - name: Lint and render the chart
        run: |
          set -eo pipefail

          helm lint charts/francis --strict \
            --set-string 'runtimePSKs[0]=lint' \
            --set-string 'bootstrap.jwt.issuer=https://kubernetes.default.svc.cluster.local' \
            --set-string 'bootstrap.jwt.audience=francis-runtime' \
            --set-string 'bootstrap.jwt.jwksURL=https://kubernetes.default.svc.cluster.local/openid/v1/jwks'

          # Rendering both database options catches template errors the linter does not reach
          echo -e "\n###\nRendering with SQLite\n"
          helm template francis charts/francis \
            --set-string 'runtimePSKs[0]=lint' \
            --set-string 'bootstrap.jwt.issuer=https://kubernetes.default.svc.cluster.local' \
            --set-string 'bootstrap.jwt.audience=francis-runtime' \
            --set-string 'bootstrap.jwt.jwksURL=https://kubernetes.default.svc.cluster.local/openid/v1/jwks' \
            >/dev/null

          echo -e "\n###\nRendering with PostgreSQL and 4 replicas\n"
          helm template francis charts/francis \
            --set-string 'runtimePSKs[0]=lint' \
            --set-string 'bootstrap.jwt.issuer=https://kubernetes.default.svc.cluster.local' \
            --set-string 'bootstrap.jwt.audience=francis-runtime' \
            --set-string 'bootstrap.jwt.jwksURL=https://kubernetes.default.svc.cluster.local/openid/v1/jwks' \
            --set database.type=postgres \
            --set-string 'database.postgres.connectionString=postgres://user:password@postgres:5432/francis' \
            --set replicaCount=4 \
            >/dev/null

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                --username "${{ github.repository_owner }}" \
                --password-stdin

      - name: Package and push the chart
        id: helm-push
        run: |
          set -eo pipefail

          mkdir -p .charts
          helm package charts/francis \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}" \
            --destination .charts

          # The chart goes under a "charts" path so its repository does not collide with the container image at ghcr.io/${REPO_OWNER}/francis
          helm push ".charts/francis-${CHART_VERSION}.tgz" "oci://ghcr.io/${REPO_OWNER}/charts" 2>&1 | tee helm-push.log

          CHART_DIGEST=$(grep -oE 'sha256:[0-9a-f]{64}' helm-push.log | head -n 1)
          if [[ -z "$CHART_DIGEST" ]]; then
            echo "Failed to determine the digest of the pushed chart"
            exit 1
          fi

          echo "digest=$CHART_DIGEST" >> $GITHUB_OUTPUT

          echo "CHART_DIGEST: '$CHART_DIGEST'"

      - name: Helm chart attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # 4.2.1
        with:
          subject-name: 'ghcr.io/${{ env.REPO_OWNER }}/charts/francis'
          subject-digest: ${{ steps.helm-push.outputs.digest }}
          push-to-registry: true

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}

    steps:

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the tag so its annotation message is available for release notes
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifacts
          path: .out

      - name: Publish release
        run: |
          # Published releases are immutable: re-running the workflow on the same tag must fail, not overwrite
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists, and published releases are immutable"
            exit 1
          fi

          # Tags carrying a pre-release identifier (such as v1.2.0-rc.1) are marked as pre-releases
          prerelease=()
          if [[ "${TAG}" == *-* ]]; then
            echo "Marking ${TAG} as a pre-release"
            prerelease=(--prerelease)
          fi

          # An annotated tag carries a message; use it as the release notes.
          # A lightweight tag has no message, so fall back to auto-generated notes.
          notes_args=()
          tag_type=$(git tag -l --format='%(objecttype)' "${TAG}")
          if [[ "${tag_type}" == "tag" ]]; then
            tag_message=$(git tag -l --format='%(contents)' "${TAG}")
            if [[ -n "${tag_message}" ]]; then
              echo "Using tag annotation as release notes"
              notes_args=(--notes "${tag_message}")
            fi
          fi
          if [[ ${#notes_args[@]} -eq 0 ]]; then
            echo "Tag has no annotation; auto-generating release notes"
            notes_args=(--generate-notes)
          fi

          shopt -s nullglob
          assets=(.out/*)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "::error::No assets found in .out"
            exit 1
          fi

          echo "Attaching ${#assets[@]} assets:"
          printf '  %s\n' "${assets[@]}"

          # Never pass --draft: the release is published immediately, with no approval step
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            "${prerelease[@]}" \
            "${notes_args[@]}" \
            "${assets[@]}"

      - name: Job summary
        run: |
          url=$(gh release view "${TAG}" --json url --jq '.url')
          {
            echo "## Release ${TAG}"
            echo
            echo "Published: <${url}>"
          } >> "${GITHUB_STEP_SUMMARY}"
